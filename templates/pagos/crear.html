
{% extends "base.html" %}

{% block title %}Registrar pago{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">

        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Registrar nuevo pago</h4>
            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">
                        <label for="membresia_id" class="form-label">
                            Membresía
                        </label>

                        <select name="membresia_id"
                                id="membresia_id"
                                class="form-select"
                                required>

                            <option value="">Seleccione una membresía</option>

                            {% for membresia in membresias %}
                                <option value="{{ membresia[0] }}">
                                    ID {{ membresia[0] }} -
                                    {{ membresia[1] }} -
                                    {{ membresia[2] }}
                                    (Vence: {{ membresia[3] }})
                                    - {{ membresia[4] }}
                                </option>
                            {% endfor %}

                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="monto" class="form-label">
                            Monto del pago
                        </label>

                        <input type="number"
                               name="monto"
                               id="monto"
                               class="form-control"
                               min="0.01"
                               step="0.01"
                               placeholder="Ejemplo: 80000"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="metodo_pago" class="form-label">
                            Método de pago
                        </label>

                        <select name="metodo_pago"
                                id="metodo_pago"
                                class="form-select"
                                required>

                            <option value="">Seleccione un método</option>
                            <option value="EFECTIVO">Efectivo</option>
                            <option value="TARJETA">Tarjeta</option>
                            <option value="TRANSFERENCIA">Transferencia</option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="estado" class="form-label">
                            Estado del pago
                        </label>

                        <select name="estado"
                                id="estado"
                                class="form-select"
                                required>

                            <option value="PENDIENTE" selected>Pendiente</option>
                            <option value="APROBADO">Aprobado</option>
                            <option value="RECHAZADO">Rechazado</option>
                            <option value="ANULADO">Anulado</option>

                        </select>
                    </div>

                    <div class="d-flex justify-content-between">

                        <a href="{{ url_for('pagos.listar_pagos') }}"
                           class="btn btn-secondary">
                            Cancelar
                        </a>

                        <button type="submit" class="btn btn-primary">
                            Registrar pago
                        </button>

                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}

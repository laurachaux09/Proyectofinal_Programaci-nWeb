
{% extends "base.html" %}

{% block title %}Registrar pago{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">

        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Registrar nuevo pago</h4>
            </div>

            <div class="card-body">

                <form method="POST">

            <div class="mb-3">
                <label for="membresia_id" class="form-label">
                    Seleccionar socio y membresía
                </label>
            
                <select name="membresia_id"
                        id="membresia_id"
                        class="form-select"
                        required>
            
                    <option value="">Seleccione un socio</option>
            
                    {% for membresia in membresias %}
                        {% if membresia[6] > 0 %}
                            <option value="{{ membresia[0] }}"
                                    data-plan="{{ membresia[3] }}"
                                    data-total="{{ membresia[4] }}"
                                    data-pagado="{{ membresia[5] }}"
                                    data-saldo="{{ membresia[6] }}">
            
                                {{ membresia[1] }} -
                                Documento: {{ membresia[2] }}
            
                            </option>
                        {% endif %}
                    {% endfor %}
                        
                </select>
            </div>

            <div id="informacion-membresia"
                 class="alert alert-info"
                 style="display: none;">

                <h6 class="mb-3">Información de la membresía</h6>

                <p class="mb-1">
                    <strong>Plan:</strong>
                    <span id="detalle-plan"></span>
                </p>
            
                <p class="mb-1">
                    <strong>Valor total:</strong>
                    <span id="detalle-total"></span>
                </p>
            
                <p class="mb-1">
                    <strong>Total pagado:</strong>
                    <span id="detalle-pagado"></span>
                </p>
            
                <p class="mb-0">
                    <strong>Saldo pendiente:</strong>
                    <span id="detalle-saldo" class="fw-bold"></span>
                </p>
            
            </div>


                    <div class="mb-3">
                        <label for="monto" class="form-label">
                            Monto del pago
                        </label>

                        <input type="number"
                               name="monto"
                               id="monto"
                               class="form-control"
                               min="0.01"
                               step="0.01"
                               placeholder="Ejemplo: 80000"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="metodo_pago" class="form-label">
                            Método de pago
                        </label>

                        <select name="metodo_pago"
                                id="metodo_pago"
                                class="form-select"
                                required>

                            <option value="">Seleccione un método</option>
                            <option value="EFECTIVO">Efectivo</option>
                            <option value="TARJETA">Tarjeta</option>
                            <option value="TRANSFERENCIA">Transferencia</option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="estado" class="form-label">
                            Estado del pago
                        </label>

                        <select name="estado"
                                id="estado"
                                class="form-select"
                                required>

                            <option value="PENDIENTE" selected>Pendiente</option>
                            <option value="APROBADO">Aprobado</option>
                            <option value="RECHAZADO">Rechazado</option>
                            <option value="ANULADO">Anulado</option>

                        </select>
                    </div>

                    <div class="d-flex justify-content-between">

                        <a href="{{ url_for('pagos.listar_pagos') }}"
                           class="btn btn-secondary">
                            Cancelar
                        </a>

                        <button type="submit" class="btn btn-primary">
                            Registrar pago
                        </button>

                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

<script>
    const selectorMembresia = document.getElementById("membresia_id");
    const informacionMembresia = document.getElementById("informacion-membresia");

    function formatoMoneda(valor) {
        return new Intl.NumberFormat("es-CO", {
            style: "currency",
            currency: "COP",
            maximumFractionDigits: 0
        }).format(Number(valor));
    }

    selectorMembresia.addEventListener("change", function () {
        const opcion = this.options[this.selectedIndex];

        if (!opcion.value) {
            informacionMembresia.style.display = "none";
            return;
        }

        document.getElementById("detalle-plan").textContent =
            opcion.dataset.plan;

        document.getElementById("detalle-total").textContent =
            formatoMoneda(opcion.dataset.total);

        document.getElementById("detalle-pagado").textContent =
            formatoMoneda(opcion.dataset.pagado);

        document.getElementById("detalle-saldo").textContent =
            formatoMoneda(opcion.dataset.saldo);

        informacionMembresia.style.display = "block";

        document.getElementById("monto").max =
            opcion.dataset.saldo;
    });
</script>

{% endblock %}

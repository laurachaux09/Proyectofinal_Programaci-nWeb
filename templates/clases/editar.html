{% extends "base.html" %}
{% block title %}Editar clase{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 650px;">
    <div class="card-header bg-dark text-white"><h5 class="mb-0">Editar clase</h5></div>
    <div class="card-body">
        <form action="{{ url_for('clases.editar_clase', clase_id=clase[0]) }}" method="POST">
            <div class="mb-3">
                <label class="form-label">Nombre de la clase</label>
                <input type="text" name="nombre_clase" value="{{ clase[1] }}" class="form-control" maxlength="50" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea name="descripcion" class="form-control" rows="2" maxlength="150">{{ clase[2] or '' }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Entrenador y Especialidad asignada</label>
                <select name="entrenador_especialidad" class="form-select" required>
                    {% set actual = clase[3]|string + '-' + clase[4]|string %}
                    {% for p in parejas %}
                    {% set opcion = p[0]|string + '-' + p[1]|string %}
                    <option value="{{ opcion }}" {% if opcion == actual %}selected{% endif %}>{{ p[2] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Fecha y hora</label>
                    <input type="datetime-local" name="fecha_hora" value="{{ clase[5] }}" class="form-control" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Duración (min)</label>
                    <input type="number" name="duracion_minutos" value="{{ clase[6] }}" class="form-control" min="1" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Cupo máximo</label>
                    <input type="number" name="cupo_maximo" value="{{ clase[7] }}" class="form-control" min="1" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Estado</label>
                <select name="estado" class="form-select" required>
                    <option value="PROGRAMADA" {% if clase[8] == 'PROGRAMADA' %}selected{% endif %}>PROGRAMADA</option>
                    <option value="FINALIZADA" {% if clase[8] == 'FINALIZADA' %}selected{% endif %}>FINALIZADA</option>
                    <option value="CANCELADA" {% if clase[8] == 'CANCELADA' %}selected{% endif %}>CANCELADA</option>
                </select>
            </div>
            <div class="d-flex justify-content-between">
                <a href="{{ url_for('clases.listar_clases') }}" class="btn btn-secondary">Cancelar y volver</a>
                <button type="submit" class="btn btn-primary">Guardar cambios</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}


{% extends "base.html" %}

{% block title %}Registrar plan{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-header bg-primary text-white">
        <h4 class="mb-0">Registrar nuevo plan de membresía</h4>
    </div>

    <div class="card-body">

        <form action="{{ url_for('planes.crear_plan') }}" method="POST">

            <div class="mb-3">
                <label class="form-label">Nombre del plan</label>

                <input type="text"
                       name="nombre_plan"
                       class="form-control"
                       maxlength="40"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Descripción</label>

                <textarea name="descripcion"
                          class="form-control"
                          maxlength="150"
                          rows="3"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Duración (días)</label>

                <input type="number"
                       name="duracion_dias"
                       class="form-control"
                       min="1"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Precio</label>

                <input type="number"
                       name="precio"
                       class="form-control"
                       min="1"
                       step="0.01"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Estado</label>

                <select name="estado" class="form-select" required>
                    <option value="ACTIVO">Activo</option>
                    <option value="INACTIVO">Inactivo</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success">
                Registrar plan
            </button>

            <a href="{{ url_for('planes.listar_planes') }}"
               class="btn btn-secondary">
                Cancelar
            </a>

        </form>

    </div>

</div>

{% endblock %}

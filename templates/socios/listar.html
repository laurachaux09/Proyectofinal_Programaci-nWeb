<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de socios</title>
</head>
<body>

    <h1>Socios registrados</h1>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Documento</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Teléfono</th>
                <th>Correo</th>
                <th>Estado</th>
            </tr>
        </thead>

        <tbody>
            {% for socio in socios %}
            <tr>
                <td>{{ socio[0] }}</td>
                <td>{{ socio[1] }}</td>
                <td>{{ socio[2] }}</td>
                <td>{{ socio[3] }}</td>
                <td>{{ socio[4] }}</td>
                <td>{{ socio[5] }}</td>
                <td>{{ socio[6] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <br>

    <a href="/">Volver al inicio</a>

</body>
</html>

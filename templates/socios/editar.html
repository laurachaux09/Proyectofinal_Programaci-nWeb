<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar socio</title>
</head>
<body>

    <h1>Editar socio</h1>

    {% if mensaje %}
        <p>{{ mensaje }}</p>
    {% endif %}

    <form action="{{ url_for('socios.editar_socio', socio_id=socio[0]) }}" method="POST">

        <label>Documento:</label>
        <input type="text" name="documento" value="{{ socio[1] }}" maxlength="20" required>
        <br><br>

        <label>Nombre:</label>
        <input type="text" name="nombre" value="{{ socio[2] }}" maxlength="50" required>
        <br><br>

        <label>Apellido:</label>
        <input type="text" name="apellido" value="{{ socio[3] }}" maxlength="50" required>
        <br><br>

        <label>Teléfono:</label>
        <input type="text" name="telefono" value="{{ socio[4] or '' }}" maxlength="20">
        <br><br>

        <label>Correo:</label>
        <input type="email" name="correo" value="{{ socio[5] or '' }}" maxlength="100">
        <br><br>

        <label>Fecha de nacimiento:</label>
        <input type="date" name="fecha_nacimiento" value="{{ socio[6] }}" required>
        <br><br>

        <label>Estado:</label>
        <select name="estado" required>
            <option value="ACTIVO" {% if socio[8] == 'ACTIVO' %}selected{% endif %}>Activo</option>
            <option value="INACTIVO" {% if socio[8] == 'INACTIVO' %}selected{% endif %}>Inactivo</option>
        </select>
        <br><br>

        <button type="submit">Guardar cambios</button>

    </form>

    <br>

    <a href="{{ url_for('socios.listar_socios') }}">Cancelar y volver</a>

</body>
</html>

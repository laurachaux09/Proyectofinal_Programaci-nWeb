{% extends "base.html" %}

{% block title %}Editar socio{% endblock %}

{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 600px;">
    <div class="card-header bg-dark text-white">
        <h5 class="mb-0">Editar socio</h5>
    </div>
    <div class="card-body">
        {% if mensaje %}
            <div class="alert alert-warning">{{ mensaje }}</div>
        {% endif %}

        <form action="{{ url_for('socios.editar_socio', socio_id=socio[0]) }}" method="POST">
            <div class="mb-3">
                <label class="form-label">Documento</label>
                <input type="text" name="documento" value="{{ socio[1] }}" class="form-control" maxlength="20" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="nombre" value="{{ socio[2] }}" class="form-control" maxlength="50" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Apellido</label>
                    <input type="text" name="apellido" value="{{ socio[3] }}" class="form-control" maxlength="50" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Teléfono</label>
                <input type="text" name="telefono" value="{{ socio[4] or '' }}" class="form-control" maxlength="20">
            </div>

            <div class="mb-3">
                <label class="form-label">Correo</label>
                <input type="email" name="correo" value="{{ socio[5] or '' }}" class="form-control" maxlength="100">
            </div>

            <div class="mb-3">
                <label class="form-label">Fecha de nacimiento</label>
                <input type="date" name="fecha_nacimiento" value="{{ socio[6] }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Estado</label>
                <select name="estado" class="form-select" required>
                    <option value="ACTIVO" {% if socio[8] == 'ACTIVO' %}selected{% endif %}>Activo</option>
                    <option value="INACTIVO" {% if socio[8] == 'INACTIVO' %}selected{% endif %}>Inactivo</option>
                </select>
            </div>

            <div class="d-flex justify-content-between">
                <a href="{{ url_for('socios.listar_socios') }}" class="btn btn-secondary">Cancelar y volver</a>
                <button type="submit" class="btn btn-primary">Guardar cambios</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

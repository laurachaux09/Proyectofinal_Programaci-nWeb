{% extends "base.html" %}

{% block title %}Nueva Inscripción - Gimnasio{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Registrar Inscripción a Clase</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="socio_id" class="form-label">Socio Activo</label>
                        <select name="socio_id" id="socio_id" class="form-select" required>
                            <option value="">-- Selecciona un socio --</option>
                            {% for s in socios %}
                            <option value="{{ s[0] }}">{{ s[1] }} - {{ s[2] }} {{ s[3] }}</option>
                            {% endfor %}
                        </select>
                        <div class="form-text">El socio debe contar con una membresía ACTIVA y vigente.</div>
                    </div>

                    <div class="mb-3">
                        <label for="clase_id" class="form-label">Clase Programada</label>
                        <select name="clase_id" id="clase_id" class="form-select" required>
                            <option value="">-- Selecciona una clase --</option>
                            {% for c in clases %}
                            <option value="{{ c[0] }}">
                                {{ c[1] }} ({{ c[4] }}) - {{ c[2].strftime('%Y-%m-%d %H:%M') }} | Cupos: {{ c[7] }}/{{ c[3] }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="estado" class="form-label">Estado</label>
                        <select name="estado" id="estado" class="form-select" required>
                            <option value="INSCRITO" selected>INSCRITO</option>
                            <option value="CANCELADO">CANCELADO</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('inscripciones_clase.listar_inscripciones') }}" class="btn btn-secondary">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">Guardar Inscripción</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

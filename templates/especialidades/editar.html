{% extends "base.html" %}
{% block title %}Editar especialidad{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 600px;">
    <div class="card-header bg-dark text-white"><h5 class="mb-0">Editar especialidad</h5></div>
    <div class="card-body">
        <form action="{{ url_for('especialidades.editar_especialidad', especialidad_id=especialidad[0]) }}" method="POST">
            <div class="mb-3">
                <label class="form-label">Nombre de la especialidad</label>
                <input type="text" name="nombre_especialidad" value="{{ especialidad[1] }}" class="form-control" maxlength="80" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea name="descripcion" class="form-control" rows="3" maxlength="250">{{ especialidad[2] or '' }}</textarea>
            </div>
            <div class="d-flex justify-content-between">
                <a href="{{ url_for('especialidades.listar_especialidades') }}" class="btn btn-secondary">Cancelar y volver</a>
                <button type="submit" class="btn btn-primary">Guardar cambios</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

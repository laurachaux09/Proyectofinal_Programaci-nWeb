
{% extends "base.html" %}

{% block title %}Editar membresía{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-header bg-warning">
        <h4 class="mb-0">Editar membresía</h4>
    </div>

    <div class="card-body">

        <form action="{{ url_for('membresias.editar_membresia', membresia_id=membresia[0]) }}"
              method="POST">

            <div class="mb-3">
                <label class="form-label">ID de membresía</label>
                <input type="text" class="form-control"
                       value="{{ membresia[0] }}" disabled>
            </div>

            <div class="mb-3">
                <label class="form-label">Socio</label>

                <select name="socio_id" class="form-select" required>
                    {% for socio in socios %}
                    <option value="{{ socio[0] }}"
                        {% if socio[0] == membresia[1] %}selected{% endif %}>
                        {{ socio[1] }} {{ socio[2] }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Plan</label>

                <select name="plan_id" class="form-select" required>
                    {% for plan in planes %}
                    <option value="{{ plan[0] }}"
                        {% if plan[0] == membresia[2] %}selected{% endif %}>
                        {{ plan[1] }} - {{ plan[2] }} días
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Fecha de inicio</label>
                <input type="date" name="fecha_inicio"
                       class="form-control"
                       value="{{ membresia[3].strftime('%Y-%m-%d') }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Fecha de vencimiento</label>
                <input type="date" name="fecha_fin"
                       class="form-control"
                       value="{{ membresia[4].strftime('%Y-%m-%d') }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Precio contratado</label>
                <input type="number" name="precio_contratado"
                       class="form-control"
                       min="0.01" step="0.01"
                       value="{{ membresia[5] }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Estado</label>

                <select name="estado" class="form-select" required>
                    <option value="ACTIVA"
                        {% if membresia[6] == 'ACTIVA' %}selected{% endif %}>
                        Activa
                    </option>

                    <option value="VENCIDA"
                        {% if membresia[6] == 'VENCIDA' %}selected{% endif %}>
                        Vencida
                    </option>

                    <option value="CANCELADA"
                        {% if membresia[6] == 'CANCELADA' %}selected{% endif %}>
                        Cancelada
                    </option>
                </select>
            </div>

            <button type="submit" class="btn btn-success">
                Guardar cambios
            </button>

            <a href="{{ url_for('membresias.listar_membresias') }}"
               class="btn btn-secondary">
                Cancelar
            </a>

        </form>

    </div>
</div>

{% endblock %}

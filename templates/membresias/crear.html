
{% extends "base.html" %}

{% block title %}Registrar membresía{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-header bg-primary text-white">
        <h4 class="mb-0">Registrar nueva membresía</h4>
    </div>

    <div class="card-body">

        <form action="{{ url_for('membresias.crear_membresia') }}"
              method="POST">

            <div class="mb-3">
                <label class="form-label">Seleccionar socio</label>

                <select name="socio_id" class="form-select" required>
                    <option value="">Seleccione un socio</option>

                    {% for socio in socios %}
                        <option value="{{ socio[0] }}">
                            {{ socio[1] }} {{ socio[2] }}
                        </option>
                    {% endfor %}

                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Seleccionar plan</label>

                <select name="plan_id" class="form-select" required>
                    <option value="">Seleccione un plan</option>

                    {% for plan in planes %}
                        <option value="{{ plan[0] }}">
                            {{ plan[1] }} -
                            {{ plan[2] }} días -
                            ${{ "{:,.0f}".format(plan[3]) }}
                        </option>
                    {% endfor %}

                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Fecha de inicio</label>

                <input type="date"
                       name="fecha_inicio"
                       class="form-control"
                       required>
            </div>

            <div class="alert alert-info">
                <strong>Información:</strong>
                La fecha de vencimiento y el precio contratado
                se calcularán automáticamente según el plan seleccionado.
            </div>

            <button type="submit" class="btn btn-success">
                Registrar membresía
            </button>

            <a href="{{ url_for('membresias.listar_membresias') }}"
               class="btn btn-secondary">
                Cancelar
            </a>

        </form>

    </div>

</div>

{% endblock %}
